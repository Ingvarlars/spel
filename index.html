<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  :root {
    --bg: #1b1f24;
    --panel: #252b33;
    --text: #e8ecef;
    --muted: #9aa5b1;
    --grid: #2c333c;
    --snake: #4ade80;
    --head: #22c55e;
    --food: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { margin: 0; font-size: 1.8rem; letter-spacing: 0.05em; }
  .scores { display: flex; gap: 24px; font-size: 1.1rem; }
  .scores span { color: var(--muted); }
  .wrap { position: relative; width: min(400px, 100%); }
  canvas {
    display: block;
    width: 100%;
    aspect-ratio: 1;
    background: var(--panel);
    border-radius: 8px;
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(0, 0, 0, 0.55);
    border-radius: 8px;
    text-align: center;
    padding: 16px;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { margin: 0; font-size: 1.5rem; }
  .overlay p { margin: 0; color: var(--muted); }
  button {
    font: inherit;
    padding: 10px 24px;
    border: none;
    border-radius: 6px;
    background: var(--head);
    color: #0b1a10;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  .help { color: var(--muted); font-size: 0.9rem; text-align: center; margin: 0; }
  .games a {
    color: #3ff6ff;
    text-decoration: none;
    border: 1px solid #3ff6ff;
    border-radius: 6px;
    padding: 6px 14px;
    box-shadow: 0 0 10px rgba(63, 246, 255, 0.4);
  }
  .games a:hover { background: rgba(63, 246, 255, 0.1); }
</style>
</head>
<body>
  <h1>🐍 Snake</h1>
  <div class="scores">
    <div>Poäng: <strong id="score">0</strong></div>
    <div>Rekord: <strong id="best">0</strong></div>
  </div>
  <div class="wrap">
    <canvas id="board" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlay-title">Snake</h2>
      <p id="overlay-text">Ät maten och undvik väggarna och dig själv.</p>
      <button id="start">Starta</button>
    </div>
  </div>
  <p class="help">Styr med piltangenterna eller WASD · Mellanslag pausar · Svep på mobilen</p>
  <p class="games"><a href="neon/index.html">Spela Neon Överlevare →</a> · <a href="stormvandrare/index.html">Spela Stormvandrare (3D) →</a></p>

<script>
(() => {
  const CELLS = 20;          // rutor per sida
  const START_SPEED = 130;   // ms per steg
  const MIN_SPEED = 60;

  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const size = canvas.width / CELLS;

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlayText = document.getElementById('overlay-text');
  const startBtn = document.getElementById('start');

  let snake, dir, queue, food, score, speed, timer, running, paused;

  let best = 0;
  try { best = Number(localStorage.getItem('snake-best')) || 0; } catch (e) {}
  bestEl.textContent = best;

  function reset() {
    const mid = Math.floor(CELLS / 2);
    snake = [{ x: mid, y: mid }, { x: mid - 1, y: mid }, { x: mid - 2, y: mid }];
    dir = { x: 1, y: 0 };
    queue = [];
    score = 0;
    speed = START_SPEED;
    scoreEl.textContent = score;
    placeFood();
  }

  function placeFood() {
    const free = [];
    for (let x = 0; x < CELLS; x++) {
      for (let y = 0; y < CELLS; y++) {
        if (!snake.some(s => s.x === x && s.y === y)) free.push({ x, y });
      }
    }
    food = free[Math.floor(Math.random() * free.length)];
  }

  function start() {
    reset();
    running = true;
    paused = false;
    overlay.classList.add('hidden');
    schedule();
    draw();
  }

  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(tick, speed);
  }

  function tick() {
    if (!running || paused) return;

    // Ta nästa riktning ur kön (förhindrar 180°-vändning vid snabba tryck)
    if (queue.length) dir = queue.shift();

    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    const ate = head.x === food.x && head.y === food.y;
    // Svansen flyttar sig samma steg, så den räknas inte som krock om vi inte äter
    const body = ate ? snake : snake.slice(0, -1);

    if (
      head.x < 0 || head.y < 0 || head.x >= CELLS || head.y >= CELLS ||
      body.some(s => s.x === head.x && s.y === head.y)
    ) {
      return gameOver();
    }

    snake.unshift(head);
    if (ate) {
      score++;
      scoreEl.textContent = score;
      speed = Math.max(MIN_SPEED, speed - 3);
      if (snake.length === CELLS * CELLS) return gameOver(true);
      placeFood();
    } else {
      snake.pop();
    }

    draw();
    schedule();
  }

  function gameOver(won = false) {
    running = false;
    clearTimeout(timer);
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem('snake-best', best); } catch (e) {}
    }
    draw();
    overlayTitle.textContent = won ? 'Du vann!' : 'Game over';
    overlayText.textContent = `Du fick ${score} poäng.`;
    startBtn.textContent = 'Spela igen';
    overlay.classList.remove('hidden');
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    if (paused) {
      clearTimeout(timer);
      overlayTitle.textContent = 'Pausat';
      overlayText.textContent = 'Tryck på mellanslag för att fortsätta.';
      startBtn.textContent = 'Fortsätt';
      overlay.classList.remove('hidden');
    } else {
      overlay.classList.add('hidden');
      schedule();
    }
  }

  function draw() {
    const css = getComputedStyle(document.documentElement);
    ctx.fillStyle = css.getPropertyValue('--panel');
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // rutnät
    ctx.strokeStyle = css.getPropertyValue('--grid');
    ctx.lineWidth = 1;
    for (let i = 1; i < CELLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * size + 0.5, 0); ctx.lineTo(i * size + 0.5, canvas.height);
      ctx.moveTo(0, i * size + 0.5); ctx.lineTo(canvas.width, i * size + 0.5);
      ctx.stroke();
    }

    // mat
    ctx.fillStyle = css.getPropertyValue('--food');
    ctx.beginPath();
    ctx.arc(food.x * size + size / 2, food.y * size + size / 2, size * 0.38, 0, Math.PI * 2);
    ctx.fill();

    // orm
    snake.forEach((s, i) => {
      ctx.fillStyle = css.getPropertyValue(i === 0 ? '--head' : '--snake');
      ctx.beginPath();
      ctx.roundRect(s.x * size + 1, s.y * size + 1, size - 2, size - 2, 4);
      ctx.fill();
    });
  }

  function turn(x, y) {
    if (!running || paused) return;
    const last = queue.length ? queue[queue.length - 1] : dir;
    if (last.x === -x && last.y === -y) return; // ingen 180°-vändning
    if (last.x === x && last.y === y) return;
    if (queue.length < 3) queue.push({ x, y });
  }

  const keys = {
    ArrowUp: [0, -1], w: [0, -1], W: [0, -1],
    ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
    ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
    ArrowRight: [1, 0], d: [1, 0], D: [1, 0],
  };

  document.addEventListener('keydown', e => {
    if (keys[e.key]) {
      e.preventDefault();
      turn(...keys[e.key]);
    } else if (e.key === ' ') {
      e.preventDefault();
      if (!running) start(); else togglePause();
    } else if (e.key === 'Enter' && !running) {
      start();
    }
  });

  // Svep för pekskärmar
  let touchStart = null;
  canvas.addEventListener('touchstart', e => {
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  canvas.addEventListener('touchend', e => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(Math.sign(dx), 0);
    else turn(0, Math.sign(dy));
  });

  startBtn.addEventListener('click', () => {
    if (running && paused) togglePause(); else start();
  });

  reset();
  draw();
})();
</script>
</body>
</html>
